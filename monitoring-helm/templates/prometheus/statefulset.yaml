{{- if .Values.prometheus.enabled }}
{{- $p := .Values.prometheus }}
{{- $hasToken := include "monitoring.minioHasToken" . }}
{{- $k8s := .Values.integrations.kubernetes.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prometheus
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monitoring.labels" (dict "root" . "name" "prometheus" "component" "metrics") | nindent 4 }}
spec:
  replicas: 1
  serviceName: prometheus
  podManagementPolicy: OrderedReady
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      {{- include "monitoring.selector" "prometheus" | nindent 6 }}
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        {{- include "monitoring.labels" (dict "root" . "name" "prometheus" "component" "metrics") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/prometheus/configmap.yaml") . | sha256sum }}
        {{- if $k8s }}
        checksum/rules: {{ include (print $.Template.BasePath "/prometheus/configmap-rules.yaml") . | sha256sum }}
        {{- end }}
        {{- if $hasToken }}
        checksum/minio-token: {{ include (print $.Template.BasePath "/prometheus/secret-minio-token.yaml") . | sha256sum }}
        {{- end }}
    spec:
      {{- if $k8s }}
      serviceAccountName: prometheus
      {{- end }}
      {{- include "monitoring.pullSecrets" . | nindent 6 }}
      securityContext:
        {{- toYaml $p.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: prometheus
          image: {{ include "monitoring.image" (dict "root" . "image" $p.image) }}
          imagePullPolicy: {{ $p.image.pullPolicy }}
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time={{ $p.retention }}
            - --web.listen-address=0.0.0.0:9090
            {{- if .Values.integrations.apm.enabled }}
            - --enable-feature=exemplar-storage      # latency graph -> trace links (APM)
            {{- end }}
          ports:
            - name: http
              containerPort: 9090
              protocol: TCP
          readinessProbe:
            httpGet: { path: /-/ready, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /-/healthy, port: http }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml $p.resources | nindent 12 }}
          securityContext:
            {{- toYaml $p.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: prometheus-data
              mountPath: /prometheus
            - name: prometheus-config
              mountPath: /etc/prometheus
            {{- if $k8s }}
            - name: prometheus-rules
              mountPath: /etc/prometheus-rules
              readOnly: true
            {{- end }}
            {{- if $hasToken }}
            - name: minio-token
              mountPath: /etc/prometheus-secrets
              readOnly: true
            {{- end }}
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config
        {{- if $k8s }}
        - name: prometheus-rules
          configMap:
            name: prometheus-rules
        {{- end }}
        {{- if $hasToken }}
        - name: minio-token
          secret:
            secretName: prometheus-minio-token
        {{- end }}
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: prometheus-data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.global.storageClassName }}
        volumeMode: Filesystem
        resources:
          requests:
            storage: {{ $p.persistence.size }}
{{- end }}
