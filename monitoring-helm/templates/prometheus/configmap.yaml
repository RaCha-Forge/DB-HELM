{{- if .Values.prometheus.enabled }}
{{- $i := .Values.integrations }}
{{- $k := $i.kubernetes }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monitoring.labels" (dict "root" . "name" "prometheus" "component" "metrics") | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: {{ .Values.prometheus.scrapeInterval }}
      evaluation_interval: {{ .Values.prometheus.scrapeInterval }}
    {{- if $k.enabled }}

    rule_files:
      - /etc/prometheus-rules/*.yml
    {{- end }}

    scrape_configs:
      {{- if $i.kafka.enabled }}

      - job_name: kafka-exporter
        scrape_interval: {{ $i.kafka.scrapeInterval }}
        static_configs:
          - targets: ["kafka-exporter:9308"]
      {{- end }}
      {{- if $i.mongodb.enabled }}

      - job_name: mongodb
        scrape_interval: {{ $i.mongodb.scrapeInterval }}
        static_configs:
          - targets: ["mongodb-exporter:9216"]
      {{- end }}
      {{- if $i.mariadb.enabled }}

      - job_name: mariadb
        scrape_interval: {{ $i.mariadb.scrapeInterval }}
        static_configs:
          - targets: ["mariadb-exporter:9104"]
      {{- end }}
      {{- if $i.minio.enabled }}
      {{- range $site := $i.minio.sites }}

      - job_name: {{ $site.name }}
        scrape_interval: {{ $i.minio.scrapeInterval }}
        metrics_path: {{ $i.minio.metricsPath }}
        scheme: {{ $i.minio.scheme }}
        {{- if or $site.bearerToken $i.minio.bearerToken }}
        authorization:
          type: Bearer
          credentials_file: /etc/prometheus-secrets/{{ $site.name }}
        {{- end }}
        static_configs:
          - targets:
              {{- range $site.targets }}
              - {{ . | quote }}
              {{- end }}
            labels:
              site: {{ $site.name }}
      {{- end }}
      {{- end }}
      {{- if $k.enabled }}

      # Pod / container CPU, memory, network from each node's kubelet (cAdvisor)
      - job_name: kubernetes-cadvisor
        scheme: https
        scrape_interval: {{ $k.cadvisor.scrapeInterval }}
        kubernetes_sd_configs:
          - role: node
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        {{- if eq $k.cadvisor.mode "kubelet" }}
        metrics_path: /metrics/cadvisor
        tls_config:
          insecure_skip_verify: {{ $k.cadvisor.insecureSkipVerify }}
        relabel_configs:
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node
        {{- else }}
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node
        {{- end }}
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: container_(tasks_state|memory_failures_total|network_tcp_usage_total|network_udp_usage_total|cpu_load_average_10s|file_descriptors|sockets|threads|threads_max|spec_.*)
            action: drop

      # Object state: replicas, restarts, requests/limits, HPA, services/endpoints
      - job_name: kube-state-metrics
        scrape_interval: {{ $k.kubeStateMetrics.scrapeInterval }}
        honor_labels: true
        static_configs:
          - targets: ["kube-state-metrics:8080"]
      {{- end }}
{{- end }}
