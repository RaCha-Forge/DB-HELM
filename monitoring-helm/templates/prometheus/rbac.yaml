{{- /*
  Prometheus runs as its own ServiceAccount. Read-only, cluster-scoped, and nothing beyond:
  discover nodes and read the kubelet metrics endpoints.
*/ -}}
{{- if and .Values.prometheus.enabled .Values.integrations.kubernetes.enabled }}
{{- $mode := .Values.integrations.kubernetes.cadvisor.mode }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monitoring.labels" (dict "root" . "name" "prometheus" "component" "metrics") | nindent 4 }}
{{- if .Values.integrations.kubernetes.clusterRbac }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-kubelet-metrics
  labels:
    {{- include "monitoring.labels" (dict "root" . "name" "prometheus" "component" "metrics") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]                 # service discovery (role: node)
    verbs: ["list", "watch"]
  - apiGroups: [""]
    {{- if eq $mode "kubelet" }}
    resources: ["nodes/metrics"]         # kubelet /metrics/cadvisor, read directly
    {{- else }}
    resources: ["nodes/proxy"]           # kubelet reached through the API server
    {{- end }}
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-kubelet-metrics
  labels:
    {{- include "monitoring.labels" (dict "root" . "name" "prometheus" "component" "metrics") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-kubelet-metrics
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
