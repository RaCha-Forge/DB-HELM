{{- /*
  One key per MinIO site (file name = site name). A site-level bearerToken wins over the
  integration-level default, so each site can use its own token.
*/ -}}
{{- if and .Values.prometheus.enabled (include "monitoring.minioHasToken" .) }}
{{- $m := .Values.integrations.minio }}
apiVersion: v1
kind: Secret
metadata:
  name: prometheus-minio-token
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monitoring.labels" (dict "root" . "name" "prometheus" "component" "metrics") | nindent 4 }}
type: Opaque
stringData:
  {{- range $m.sites }}
  {{- $token := default $m.bearerToken .bearerToken }}
  {{- if $token }}
  {{ .name }}: {{ $token | quote }}
  {{- end }}
  {{- end }}
{{- end }}
