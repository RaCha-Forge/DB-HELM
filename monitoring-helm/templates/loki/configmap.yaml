{{- if .Values.loki.enabled }}
{{- $l := .Values.loki }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monitoring.labels" (dict "root" . "name" "loki" "component" "logs") | nindent 4 }}
data:
  loki.yaml: |
    auth_enabled: false

    server:
      http_listen_port: 3100

    ingester:
      lifecycler:
        ring:
          kvstore:
            store: inmemory
          replication_factor: 1
      chunk_idle_period: 5m
      chunk_retain_period: 30s
      wal:
        enabled: true
        dir: /loki/wal

    schema_config:
      configs:
        - from: 2024-01-01
          store: boltdb-shipper
          object_store: filesystem
          schema: v11
          index:
            prefix: index_
            period: 24h

    storage_config:
      boltdb_shipper:
        active_index_directory: /loki/index
        cache_location: /loki/cache
        shared_store: filesystem
      filesystem:
        directory: /loki/chunks

    compactor:
      working_directory: /loki/compactor
      shared_store: filesystem
      retention_enabled: true
      retention_delete_delay: 2h
      compaction_interval: 10m

    limits_config:
      retention_period: {{ $l.retention }}
      reject_old_samples: true
      reject_old_samples_max_age: {{ $l.retention }}
      ingestion_rate_mb: {{ $l.limits.ingestionRateMb }}
      ingestion_burst_size_mb: {{ $l.limits.ingestionBurstSizeMb }}
      per_stream_rate_limit: {{ $l.limits.perStreamRateLimit }}
      per_stream_rate_limit_burst: {{ $l.limits.perStreamRateLimitBurst }}
{{- end }}
