{{- if .Values.promtail.enabled }}
{{- $ns := default (list .Release.Namespace) .Values.promtail.namespaces }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monitoring.labels" (dict "root" . "name" "promtail" "component" "log-shipper") | nindent 4 }}
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0

    positions:
      filename: /run/promtail/positions-v3.yaml

    clients:
      - url: {{ include "monitoring.lokiUrl" . }}/loki/api/v1/push

    scrape_configs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: {{ $ns | toJson }}
            selectors:
              - role: pod
                field: "spec.nodeName=${HOSTNAME}"

        pipeline_stages:
          - cri: {}
          - drop:
              older_than: {{ .Values.loki.retention }}
              drop_counter_reason: too_old

        relabel_configs:
          - source_labels: ["__meta_kubernetes_pod_name"]
            regex: {{ .Values.promtail.excludePods | quote }}
            action: drop

          - source_labels: ["__meta_kubernetes_namespace"]
            target_label: "namespace"
          - source_labels: ["__meta_kubernetes_pod_name"]
            target_label: "pod"
          - source_labels: ["__meta_kubernetes_pod_container_name"]
            target_label: "container"
          - source_labels: ["__meta_kubernetes_pod_node_name"]
            target_label: "node"

          # workload = deployment / statefulset / daemonset / job name (defaults to pod name)
          - source_labels: ["__meta_kubernetes_pod_name"]
            target_label: "workload"
          - source_labels: ["__meta_kubernetes_pod_controller_kind", "__meta_kubernetes_pod_controller_name"]
            separator: ";"
            regex: "ReplicaSet;(.+)-[a-z0-9]{8,10}"
            target_label: "workload"
            replacement: "$1"
          - source_labels: ["__meta_kubernetes_pod_controller_kind", "__meta_kubernetes_pod_controller_name"]
            separator: ";"
            regex: "(?:StatefulSet|DaemonSet|Job);(.+)"
            target_label: "workload"
            replacement: "$1"

          # workload_kind = Deployment / StatefulSet / DaemonSet / Job / Pod
          - source_labels: ["__meta_kubernetes_pod_name"]
            target_label: "workload_kind"
            replacement: "Pod"
          - source_labels: ["__meta_kubernetes_pod_controller_kind"]
            regex: "ReplicaSet"
            target_label: "workload_kind"
            replacement: "Deployment"
          - source_labels: ["__meta_kubernetes_pod_controller_kind"]
            regex: "(StatefulSet|DaemonSet|Job)"
            target_label: "workload_kind"
            replacement: "$1"

          - source_labels: ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
            separator: "/"
            action: replace
            target_label: "__path__"
            replacement: "/var/log/pods/*$1/*.log"
{{- end }}
