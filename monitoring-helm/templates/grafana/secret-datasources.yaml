{{- /*
  Datasources live in a Secret (not a ConfigMap) because Redis credentials can be embedded.
  Fixed UIDs (prometheus / loki / redis-timeseries) are what the dashboard JSON files reference.
*/ -}}
{{- if .Values.grafana.enabled }}
{{- $i := .Values.integrations }}
{{- $r := $i.redis }}
{{- $names := list }}
{{- if .Values.prometheus.enabled }}{{ $names = append $names "Prometheus" }}{{ end }}
{{- if .Values.loki.enabled }}{{ $names = append $names "Loki" }}{{ end }}
{{- if $r.enabled }}{{ $names = append $names "Redis" }}{{ range $k, $x := $r.instances }}{{ $names = append $names (default $k $x.name) }}{{ end }}{{ end }}
{{- $apm := $i.apm.enabled }}
{{- if $apm }}{{ $names = append $names "Tempo" }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: grafana-datasources
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monitoring.labels" (dict "root" . "name" "grafana" "component" "visualization") | nindent 4 }}
type: Opaque
stringData:
  datasources.yaml: |
    apiVersion: 1
    {{- if and .Values.grafana.replaceExistingDatasources $names }}
    deleteDatasources:
      {{- range $names }}
      - name: {{ . }}
        orgId: 1
      {{- end }}
    {{- end }}
    datasources:
      {{- if .Values.prometheus.enabled }}
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        orgId: 1
        url: {{ include "monitoring.prometheusUrl" . }}
        isDefault: true
        editable: false
        jsonData:
          timeInterval: {{ .Values.prometheus.scrapeInterval | quote }}
      {{- end }}
      {{- if .Values.loki.enabled }}
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        orgId: 1
        url: {{ include "monitoring.lokiUrl" . }}
        isDefault: {{ not .Values.prometheus.enabled }}
        editable: false
        jsonData:
          maxLines: 5000
          {{- if $apm }}
          derivedFields:
            # winston JSON lines carry "trace_id":"<id>" (added by the OTel winston instrumentation)
            - name: TraceID
              datasourceUid: tempo
              matcherRegex: '"trace_id":"(\w+)"'
              url: '$${__value.raw}'
              urlDisplayLabel: Open trace
          {{- end }}
      {{- end }}
      {{- if $apm }}
      - name: Tempo
        uid: tempo
        type: tempo
        access: proxy
        orgId: 1
        url: {{ include "monitoring.tempoUrl" . }}
        isDefault: false
        editable: false
        jsonData:
          nodeGraph:
            enabled: true
          streamingEnabled:
            search: true
          {{- if .Values.prometheus.enabled }}
          serviceMap:
            datasourceUid: prometheus
          tracesToMetrics:
            datasourceUid: prometheus
            spanStartTimeShift: '-5m'
            spanEndTimeShift: '5m'
            tags:
              - key: service.name
                value: service_name
            queries:
              - name: Request rate
                query: 'sum(rate(traces_span_metrics_calls_total{$$__tags}[$$__rate_interval]))'
              - name: p95 latency (ms)
                query: 'histogram_quantile(0.95, sum by (le) (rate(traces_span_metrics_duration_milliseconds_bucket{$$__tags}[$$__rate_interval])))'
          {{- end }}
          {{- if .Values.loki.enabled }}
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: '-5m'
            spanEndTimeShift: '5m'
            filterByTraceID: true
            filterBySpanID: false
            tags:
              - key: k8s.namespace.name
                value: namespace
              - key: k8s.pod.name
                value: pod
          {{- end }}
      {{- end }}
      {{- if $r.enabled }}
      - name: Redis
        uid: redis-timeseries
        type: redis-datasource
        access: proxy
        orgId: 1
        url: {{ printf "%s://%s:%v" (ternary "rediss" "redis" $r.tls) $r.host $r.port | quote }}
        isDefault: false
        editable: false
        jsonData:
          client: {{ $r.client }}
          poolSize: {{ $r.poolSize }}
          timeout: {{ $r.timeoutSeconds }}
          pingInterval: 0
          pipelineWindow: 0
          {{- if $r.sentinelName }}
          sentinelName: {{ $r.sentinelName | quote }}
          {{- end }}
          {{- if $r.user }}
          acl: true
          user: {{ include "monitoring.gfEscape" $r.user | quote }}
          {{- end }}
          {{- if $r.tls }}
          tls: true
          tlsSkipVerify: {{ $r.tlsSkipVerify }}
          {{- end }}
        {{- if $r.password }}
        secureJsonData:
          password: {{ include "monitoring.gfEscape" $r.password | quote }}
        {{- end }}
      {{- /* Extra Redis instances: one datasource each, pick them with the datasource drop-down of the Redis dashboards */}}
      {{- range $k, $x := $r.instances }}
      {{- $xname := default $k $x.name }}
      {{- $xtls := default false $x.tls }}
      - name: {{ $xname | quote }}
        uid: {{ default (printf "redis-%s" (lower (replace " " "-" $xname))) $x.uid | quote }}
        type: redis-datasource
        access: proxy
        orgId: 1
        url: {{ printf "%s://%s:%v" (ternary "rediss" "redis" $xtls) $x.host $x.port | quote }}
        isDefault: false
        editable: false
        jsonData:
          client: {{ default "standalone" $x.client }}
          poolSize: {{ default $r.poolSize $x.poolSize }}
          timeout: {{ default $r.timeoutSeconds $x.timeoutSeconds }}
          pingInterval: 0
          pipelineWindow: 0
          {{- if $x.sentinelName }}
          sentinelName: {{ $x.sentinelName | quote }}
          {{- end }}
          {{- if $x.user }}
          acl: true
          user: {{ include "monitoring.gfEscape" $x.user | quote }}
          {{- end }}
          {{- if $xtls }}
          tls: true
          tlsSkipVerify: {{ default false $x.tlsSkipVerify }}
          {{- end }}
        {{- if $x.password }}
        secureJsonData:
          password: {{ include "monitoring.gfEscape" $x.password | quote }}
        {{- end }}
      {{- end }}
      {{- end }}
{{- end }}
