{{- if .Values.grafana.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monitoring.labels" (dict "root" . "name" "grafana" "component" "visualization") | nindent 4 }}
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: fyno
        orgId: 1
        type: file
        disableDeletion: true          # dashboards are owned by Helm, not by the UI
        allowUiUpdates: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana-dashboards
          foldersFromFilesStructure: true   # sub-directory name = Grafana folder
{{- end }}
