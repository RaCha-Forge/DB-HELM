apiVersion: v2
name: monitoring
description: >-
  Single-chart observability stack for the Fyno on-prem VKS cluster. Grafana,
  Prometheus, Loki, Promtail and the Kafka / MariaDB / MongoDB exporters, each
  behind an on/off switch, with datasources and dashboards provisioned from values.
type: application
version: 1.1.0
appVersion: "2026.10"
kubeVersion: ">=1.24.0-0"
keywords:
  - monitoring
  - observability
  - grafana
  - prometheus
  - loki
  - promtail
  - kafka
  - mariadb
  - mongodb
  - minio
  - redis
maintainers:
  - name: Fyno DevOps
