# =============================================================================
#  monitoring - Fyno observability stack
# -----------------------------------------------------------------------------
#  Every component and every integration is a real boolean (true / false).
#  Flip a switch and `helm upgrade` does the rest:
#
#      enabled: true   ->  exporter/workload + Prometheus scrape job
#                          + Grafana datasource + Grafana dashboard
#      enabled: false  ->  none of the above is rendered
#
#  Credentials are optional everywhere. Leave user / password empty ("") and the
#  chart simply omits the auth settings - no empty-password surprises.
#
#  DO NOT EDIT THIS FILE. These are the defaults. Put what differs per environment
#  (registry, storage, hosts, switches, passwords) in ONE file, values-<env>.yaml:
#      cp values-example.yaml values-prod.yaml
#      helm upgrade -i monitoring . -n <namespace> -f values-prod.yaml
# =============================================================================

# -----------------------------------------------------------------------------
#  Global
# -----------------------------------------------------------------------------
global:
  imageRegistry: ecpxdcnprhrbr.esafhub.com   # prefixed to every image repository below
  imagePullSecrets: []                       # e.g. [chainguard-registry]
  storageClassName: prodvks-storage-policy   # PVCs of Grafana, Prometheus and Loki
  commonLabels: {}                           # added to every object

# -----------------------------------------------------------------------------
#  Dashboards - one switch per dashboard
# -----------------------------------------------------------------------------
#  Layout:  dashboards.<set>.<file name without .json>: true | false
#
#  * A set is a folder under dashboards/ (logs, kafka, mariadb, mongodb, minio,
#    redis, kubernetes) and is shown in Grafana as a folder of the same name.
#    The set itself is switched by `<integration>.dashboard` above.
#  * Anything NOT listed here is ON. To add your own dashboard: drop the JSON
#    into dashboards/<set>/ and `helm upgrade` - it appears automatically.
#    List it below only when you want to switch it off.
#  * redis / redis-streaming-v8 are not files in this chart: they come from the
#    Grafana Redis plugin that is already installed in the Grafana image
#    (see integrations.redis.pluginDashboards).
dashboards:
  apm:
    apm-overview: true                                            # all applications at a glance
    apm-application: true                                         # one application in depth (endpoints, DB, runtime, pods)
    apm-topology: true                                            # service map + dependency table
    apm-traces: true                                              # trace explorer (list, waterfall, span table, logs)
  logs:
    fyno-logs: true
  kafka:
    fyno-kafka: true
  mariadb:
    mariadb-production-observability: true
  mongodb:
    mongodb-production-observability: true
  minio:
    minio-production-active-active-v3: true
  redis:
    redis: true                                                   # plugin: "Redis"
    redis-streaming-v8: true                                      # plugin: "Redis Streaming"
    redis-timeseries-notifications: true
    redis-timeseries-notifications-today-vs-yesterday: true
  kubernetes:
    fyno-workloads: true

# -----------------------------------------------------------------------------
#  Core components
# -----------------------------------------------------------------------------
grafana:
  enabled: true
  image: { repository: fyno/fyno/grafana, tag: 12-redis, pullPolicy: IfNotPresent }  # 12-redis bundles the Redis datasource plugin
  admin:
    user: admin
    password: ""            # REQUIRED unless existingSecret is set
    existingSecret: ""      # Secret with keys admin-user and admin-password
  service:
    type: NodePort          # ClusterIP | NodePort | LoadBalancer
    port: 3000
    nodePort: ""            # leave empty to let Kubernetes pick
  persistence:
    size: 10Gi
  bundledPlugins:
    enabled: true                    # use the plugins baked into the image (Redis datasource, ...); the data volume can no longer hide them
    sourceDir: ""                    # where the image keeps them; empty = auto-detect (/var/lib/grafana/plugins, ...)
  replaceExistingDatasources: true   # delete same-named UI-created datasources so provisioning can own them
  extraEnv: []                       # [{name: GF_SERVER_ROOT_URL, value: "https://grafana.example.com"}]
  resources: {}
  podSecurityContext: { fsGroup: 472, fsGroupChangePolicy: OnRootMismatch }
  containerSecurityContext: { runAsUser: 472, runAsGroup: 472, allowPrivilegeEscalation: false }

prometheus:
  enabled: true
  image: { repository: fyno/fyno/prometheus, tag: "3.5", pullPolicy: IfNotPresent }
  retention: 15d
  scrapeInterval: 15s
  persistence:
    size: 20Gi
  resources: {}
  podSecurityContext: { fsGroup: 0, fsGroupChangePolicy: OnRootMismatch }   # matches the running cluster
  containerSecurityContext: { runAsUser: 0, runAsGroup: 0 }                 # matches the running cluster

loki:
  enabled: true
  dashboard: true            # provisions the "Fyno Logs" dashboard
  image: { repository: fyno/loki, tag: 2.9.0, pullPolicy: IfNotPresent }
  retention: 120h            # 5 days; also used as promtail drop window and reject_old_samples age
  persistence:
    size: 40Gi
  limits:
    ingestionRateMb: 64
    ingestionBurstSizeMb: 128
    perStreamRateLimit: 5MB
    perStreamRateLimitBurst: 15MB
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits: { memory: 1536Mi }
  podSecurityContext: { fsGroup: 10001 }
  containerSecurityContext: { runAsUser: 10001, runAsGroup: 10001 }

promtail:
  enabled: true
  image: { repository: fyno/promtail, tag: 2.9.0, pullPolicy: IfNotPresent }
  namespaces: []                              # empty = release namespace only
  excludePods: "promtail-.*|trendmicro-.*"    # regex of pod names never shipped
  hostNetwork: true
  nodeSelector: {}                            # e.g. { app: fyno } = only nodes that run your pods
  positionsHostPath: /run/promtail            # bump the file name in the ConfigMap if you ever need a full re-read
  tolerations:
    - operator: Exists                        # run on control-plane / tainted nodes too
  resources:
    limits: { cpu: 100m, memory: 256Mi }

# -----------------------------------------------------------------------------
#  Integrations  (one block per data source, all OFF by default)
# -----------------------------------------------------------------------------
integrations:

  # ---- Kafka ---------------------------------------------------------------
  kafka:
    enabled: false
    dashboard: true
    image: { repository: fyno/kafka-exporter, tag: v1.9.0, pullPolicy: IfNotPresent }
    host: ""                       # broker host / IP            (required when enabled)
    port: 9092
    extraBrokers: []               # additional "host:port" entries
    version: 3.6.0                 # Kafka protocol version
    user: ""                       # leave empty for PLAINTEXT brokers
    password: ""
    saslMechanism: plain           # plain | scram-sha256 | scram-sha512  (used only when user is set)
    tls:
      enabled: false
      insecureSkipVerify: false
    groupFilter: "fyno-consumer-group-.*"
    topicFilter: ""
    refreshMetadata: 30s
    scrapeInterval: 30s
    replicas: 1
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { memory: 256Mi }
    podSecurityContext: { runAsNonRoot: true, runAsUser: 65534 }

  # ---- MariaDB -------------------------------------------------------------
  mariadb:
    enabled: false
    dashboard: true
    image: { repository: fyno/fyno/grafana, tag: mysqld-exporter, pullPolicy: Always }
    host: ""                       # (required when enabled)
    port: 3306
    user: ""                       # leave empty if the exporter account has no name/password
    password: ""
    scrapeInterval: 15s
    replicas: 1
    resources:
      requests: { cpu: 20m, memory: 32Mi }
      limits: { cpu: 100m, memory: 128Mi }
    podSecurityContext: {}

  # ---- MongoDB -------------------------------------------------------------
  mongodb:
    enabled: false
    dashboard: true
    image: { repository: fyno/fyno/grafana, tag: mongodb-exporter, pullPolicy: Always }
    hosts: []                      # ["mongo-0.mongo.ns.svc:28128", "mongo-1.mongo.ns.svc:28128"]  (required when enabled)
    user: ""                       # leave empty for unauthenticated deployments
    password: ""
    authDatabase: admin
    tls: false
    directConnect: false
    collectAll: true
    scrapeInterval: 15s
    replicas: 1
    resources:
      requests: { cpu: 20m, memory: 64Mi }
      limits: { memory: 256Mi }
    podSecurityContext: {}

  # ---- MinIO ---------------------------------------------------------------
  # MinIO exposes its own metrics, so there is no exporter to run: this block
  # only adds Prometheus scrape jobs plus the dashboard. Prometheus must be able
  # to reach each target. Set bearerToken only when MinIO does not run with
  # MINIO_PROMETHEUS_AUTH_TYPE=public  (token from: mc admin prometheus generate <alias> --api-version v3).
  minio:
    enabled: false
    dashboard: true
    metricsPath: /minio/metrics/v3
    scheme: http
    bearerToken: ""                # default token for every site; a site-level bearerToken overrides it
    scrapeInterval: 15s
    sites:                         # each site becomes job "<name>" with label site="<name>"
      - name: minio-a
        targets: ["minio-a-headless:9000"]
        bearerToken: ""            # optional: this site's own token (MinIO issues one per cluster)
      - name: minio-b
        targets: ["minio-b-headless:9000"]
        bearerToken: ""

  # ---- Kubernetes (pods / workloads / services) ------------------------------
  # Per-pod and per-workload CPU, memory, network, restarts, replica counts, HPA
  # and Service-endpoint health. Deploys kube-state-metrics, scrapes each node's
  # kubelet (cAdvisor), adds the recording rules and the "Fyno Workloads - Service
  # Level" dashboard. Needs prometheus.enabled=true.
  #
  # Permissions created (read-only, least privilege):
  #   ClusterRole  prometheus-kubelet-metrics : nodes (list, watch) + nodes/metrics (get)
  #   ClusterRole  kube-state-metrics-nodes   : nodes (list, watch)
  #   Role         kube-state-metrics         : pods, services, endpoints, deployments,
  #                                             statefulsets, daemonsets, HPAs (list, watch)
  #                                             in every namespace listed below
  kubernetes:
    enabled: false
    dashboard: true
    namespaces: []                 # namespaces to monitor; empty = release namespace only
    clusterRbac: true              # create the 2 ClusterRoles + 2 ClusterRoleBindings (needs cluster-admin rights).
                                   # false: skip them and have a cluster admin apply files/kubernetes-cluster-rbac.yaml once
    cadvisor:
      enabled: true                # false: no per-pod CPU/memory/network (needs cluster-wide node access)
      mode: kubelet                # kubelet          : Prometheus -> node:10250 (needs nodes/metrics)
                                   # apiserver-proxy  : Prometheus -> API server -> kubelet (needs nodes/proxy);
                                   #                    use if pods cannot reach node port 10250
      insecureSkipVerify: true     # kubelet serving certificates are usually self-signed (kubelet mode only)
      scrapeInterval: 30s          # keep <= 30s: the recording rules use 2m rate windows
    kubeStateMetrics:
      nodeMetrics: true            # also export node state (needs the kube-state-metrics-nodes ClusterRole)
      image: { repository: fyno/kube-state-metrics, tag: v2.13.0, pullPolicy: IfNotPresent }
      scrapeInterval: 30s          # 15s gives faster replica / health updates
      replicas: 1
      resources:
        requests: { cpu: 50m, memory: 128Mi }
        limits: { memory: 256Mi }

  # ---- APM: traces + application metrics (OpenTelemetry) --------------------
  # Renders an OpenTelemetry Collector, Tempo (trace storage), a Grafana Tempo
  # datasource (trace <-> logs <-> metrics links) and the "APM" dashboard.
  # Applications send OTLP to the Collector; see docs/apm-instrumentation.md.
  # Needs prometheus.enabled=true (span metrics are scraped from the Collector).
  apm:
    enabled: false
    dashboard: true
    retention: 96h                 # how long Tempo keeps traces (96h = 4 days)
    sampling:
      enabled: true                # tail sampling in the Collector
      decisionWait: 10s            # wait this long for a trace to finish before deciding
      slowThresholdMs: 1000        # keep every trace slower than this
      normalPercent: 10            # % of healthy, fast traces to keep (errors + slow ones are always kept)
      maxTraces: 50000             # traces held in memory while waiting for the decision
    spanMetrics:
      perInstance: true            # also split request metrics per pod (adds a k8s_pod_name label; more series)
    serviceGraph:
      enabled: true                # service topology: who calls whom, including databases
    runtimeMetrics:
      enabled: true                # Node.js event loop / heap / GC metrics sent by the apps (needs OTEL_METRICS_EXPORTER=otlp)
    collector:
      image: { repository: otel/opentelemetry-collector-contrib, tag: 0.161.0, pullPolicy: IfNotPresent }
      # Keep 1 replica: tail sampling must see every span of a trace on the same Collector.
      replicas: 1
      resources:
        requests: { cpu: 250m, memory: 512Mi }
        limits: { cpu: "1", memory: 2Gi }
    tempo:
      image: { repository: grafana/tempo, tag: 2.10.10, pullPolicy: IfNotPresent }
      persistence:
        size: 60Gi
      resources:
        requests: { cpu: 500m, memory: 1Gi }
        limits: { cpu: "2", memory: 3Gi }
      podSecurityContext: { fsGroup: 10001, fsGroupChangePolicy: OnRootMismatch }
    # Env vars handed to application pods through the ConfigMap `otel-app-config`.
    # Add it to a service with `envFrom` when that service has APM turned on.
    clientConfig:
      OTEL_TRACES_SAMPLER: parentbased_always_on     # sampling is decided in the Collector
      OTEL_METRICS_EXPORTER: otlp                       # Node runtime metrics (event loop, heap, GC); set to none to disable
      OTEL_METRIC_EXPORT_INTERVAL: "30000"
      OTEL_LOGS_EXPORTER: none
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_PROPAGATORS: tracecontext,baggage
      OTEL_NODE_DISABLED_INSTRUMENTATIONS: fs,dns,net   # very noisy, little value
      OTEL_NODE_RESOURCE_DETECTORS: env,host,os,process # skip cloud-metadata probes (slow / noisy on-prem)

  # ---- Redis ---------------------------------------------------------------
  # Redis is read directly by the Grafana Redis datasource plugin (no exporter).
  redis:
    enabled: false
    dashboard: true                # master switch for the Redis dashboard folder
    pluginDashboards:
      enabled: true                # also provision the dashboards bundled with the Grafana Redis plugin
      pluginId: redis-datasource
      files: [redis, redis-streaming-v8]   # plugin dashboard file names (without .json); switch each one under `dashboards.redis`
    host: ""                       # (required when enabled)
    port: 6379
    user: ""                       # ACL user, optional
    password: ""
    client: standalone             # standalone | cluster | sentinel
    sentinelName: ""               # only for client: sentinel
    tls: false
    tlsSkipVerify: false
    poolSize: 5
    timeoutSeconds: 10
    # More Redis instances: one extra Grafana datasource each (the dashboards have a datasource drop-down).
    # A map (key = any short id); each entry may carry its own password.
    # Fields: host, port (required); name (default = key), user, password, client, tls, tlsSkipVerify, sentinelName, uid optional.
    instances: {}
    #  cache: { name: Redis Cache, host: redis-cache-0.redis-cache.fyno.svc.cluster.local, port: 6001 }
