# Cluster-scoped RBAC for the monitoring chart (namespace fyno). Apply ONCE as cluster-admin:
#   kubectl apply -f kubernetes-cluster-rbac.yaml
# Used with integrations.kubernetes.clusterRbac: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-state-metrics-nodes
  labels:
    app: kube-state-metrics
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/instance: monitoring
    app.kubernetes.io/component: exporter
    app.kubernetes.io/part-of: fyno-monitoring
rules:
- apiGroups:
  - ''
  resources:
  - nodes
  verbs:
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-kubelet-metrics
  labels:
    app: prometheus
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/instance: monitoring
    app.kubernetes.io/component: metrics
    app.kubernetes.io/part-of: fyno-monitoring
rules:
- apiGroups:
  - ''
  resources:
  - nodes
  verbs:
  - list
  - watch
- apiGroups:
  - ''
  resources:
  - nodes/metrics
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-state-metrics-nodes
  labels:
    app: kube-state-metrics
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/instance: monitoring
    app.kubernetes.io/component: exporter
    app.kubernetes.io/part-of: fyno-monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-state-metrics-nodes
subjects:
- kind: ServiceAccount
  name: kube-state-metrics
  namespace: fyno
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-kubelet-metrics
  labels:
    app: prometheus
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/instance: monitoring
    app.kubernetes.io/component: metrics
    app.kubernetes.io/part-of: fyno-monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-kubelet-metrics
subjects:
- kind: ServiceAccount
  name: prometheus
  namespace: fyno
