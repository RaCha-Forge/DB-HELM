# Recording rules: join container metrics (cAdvisor) and object state (kube-state-metrics)
# to workload level (Deployment / StatefulSet / DaemonSet / Job / bare Pod).
groups:
  - name: fyno.workload.ownership
    interval: 15s
    rules:
      - record: fyno:workload_pod:owner
        expr: |
          max by (namespace, pod, workload, workload_type) (
            label_replace(label_replace(kube_pod_owner{owner_kind="ReplicaSet"},
              "workload", "$1", "owner_name", "(.+)-[a-z0-9]{8,10}"),
              "workload_type", "deployment", "namespace", ".*")
          )
          or
          max by (namespace, pod, workload, workload_type) (
            label_replace(label_replace(kube_pod_owner{owner_kind="StatefulSet"},
              "workload", "$1", "owner_name", "(.+)"),
              "workload_type", "statefulset", "namespace", ".*")
          )
          or
          max by (namespace, pod, workload, workload_type) (
            label_replace(label_replace(kube_pod_owner{owner_kind="DaemonSet"},
              "workload", "$1", "owner_name", "(.+)"),
              "workload_type", "daemonset", "namespace", ".*")
          )
          or
          max by (namespace, pod, workload, workload_type) (
            label_replace(label_replace(kube_pod_owner{owner_kind="Job"},
              "workload", "$1", "owner_name", "(.+)"),
              "workload_type", "job", "namespace", ".*")
          )
          or
          max by (namespace, pod, workload, workload_type) (
            label_replace(label_replace(kube_pod_owner{owner_kind="<none>"},
              "workload", "$1", "pod", "(.+)"),
              "workload_type", "pod", "namespace", ".*")
          )

  - name: fyno.workload.replicas
    interval: 15s
    rules:
      - record: fyno:workload_replicas_desired
        expr: |
          sum by (namespace, workload, workload_type) (
            label_replace(label_replace(kube_deployment_spec_replicas,
              "workload", "$1", "deployment", "(.+)"),
              "workload_type", "deployment", "namespace", ".*"))
          or
          sum by (namespace, workload, workload_type) (
            label_replace(label_replace(kube_statefulset_replicas,
              "workload", "$1", "statefulset", "(.+)"),
              "workload_type", "statefulset", "namespace", ".*"))
          or
          sum by (namespace, workload, workload_type) (
            label_replace(label_replace(kube_daemonset_status_desired_number_scheduled,
              "workload", "$1", "daemonset", "(.+)"),
              "workload_type", "daemonset", "namespace", ".*"))
      - record: fyno:workload_replicas_available
        expr: |
          sum by (namespace, workload, workload_type) (
            label_replace(label_replace(kube_deployment_status_replicas_available,
              "workload", "$1", "deployment", "(.+)"),
              "workload_type", "deployment", "namespace", ".*"))
          or
          sum by (namespace, workload, workload_type) (
            label_replace(label_replace(kube_statefulset_status_replicas_ready,
              "workload", "$1", "statefulset", "(.+)"),
              "workload_type", "statefulset", "namespace", ".*"))
          or
          sum by (namespace, workload, workload_type) (
            label_replace(label_replace(kube_daemonset_status_number_ready,
              "workload", "$1", "daemonset", "(.+)"),
              "workload_type", "daemonset", "namespace", ".*"))

  - name: fyno.workload.resources
    interval: 30s
    rules:
      - record: fyno:workload_cpu_usage_cores
        expr: |
          sum by (namespace, workload, workload_type) (
            sum by (namespace, pod) (rate(container_cpu_usage_seconds_total{container!="", container!="POD"}[2m]))
            * on (namespace, pod) group_left (workload, workload_type) fyno:workload_pod:owner)
      - record: fyno:workload_memory_working_set_bytes
        expr: |
          sum by (namespace, workload, workload_type) (
            sum by (namespace, pod) (container_memory_working_set_bytes{container!="", container!="POD"})
            * on (namespace, pod) group_left (workload, workload_type) fyno:workload_pod:owner)
      - record: fyno:workload_cpu_requests_cores
        expr: |
          sum by (namespace, workload, workload_type) (
            sum by (namespace, pod) (kube_pod_container_resource_requests{resource="cpu"}
              and on (namespace, pod, container) (kube_pod_container_status_running == 1))
            * on (namespace, pod) group_left (workload, workload_type) fyno:workload_pod:owner)
      - record: fyno:workload_cpu_limits_cores
        expr: |
          sum by (namespace, workload, workload_type) (
            sum by (namespace, pod) (kube_pod_container_resource_limits{resource="cpu"}
              and on (namespace, pod, container) (kube_pod_container_status_running == 1))
            * on (namespace, pod) group_left (workload, workload_type) fyno:workload_pod:owner)
      - record: fyno:workload_memory_requests_bytes
        expr: |
          sum by (namespace, workload, workload_type) (
            sum by (namespace, pod) (kube_pod_container_resource_requests{resource="memory"}
              and on (namespace, pod, container) (kube_pod_container_status_running == 1))
            * on (namespace, pod) group_left (workload, workload_type) fyno:workload_pod:owner)
      - record: fyno:workload_memory_limits_bytes
        expr: |
          sum by (namespace, workload, workload_type) (
            sum by (namespace, pod) (kube_pod_container_resource_limits{resource="memory"}
              and on (namespace, pod, container) (kube_pod_container_status_running == 1))
            * on (namespace, pod) group_left (workload, workload_type) fyno:workload_pod:owner)
      - record: fyno:workload_network_receive_bytes_rate
        expr: |
          sum by (namespace, workload, workload_type) (
            sum by (namespace, pod) (rate(container_network_receive_bytes_total[2m]))
            * on (namespace, pod) group_left (workload, workload_type) fyno:workload_pod:owner)
      - record: fyno:workload_network_transmit_bytes_rate
        expr: |
          sum by (namespace, workload, workload_type) (
            sum by (namespace, pod) (rate(container_network_transmit_bytes_total[2m]))
            * on (namespace, pod) group_left (workload, workload_type) fyno:workload_pod:owner)
      - record: fyno:workload_cpu_throttled_ratio
        expr: |
          sum by (namespace, workload, workload_type) (
            sum by (namespace, pod) (rate(container_cpu_cfs_throttled_periods_total{container!=""}[2m]))
            * on (namespace, pod) group_left (workload, workload_type) fyno:workload_pod:owner)
          /
          sum by (namespace, workload, workload_type) (
            sum by (namespace, pod) (rate(container_cpu_cfs_periods_total{container!=""}[2m]))
            * on (namespace, pod) group_left (workload, workload_type) fyno:workload_pod:owner)
      - record: fyno:workload_restarts_1h
        expr: |
          sum by (namespace, workload, workload_type) (
            sum by (namespace, pod) (increase(kube_pod_container_status_restarts_total[1h]))
            * on (namespace, pod) group_left (workload, workload_type) fyno:workload_pod:owner)
