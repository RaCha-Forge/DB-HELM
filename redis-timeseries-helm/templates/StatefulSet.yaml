{{- if eq .Values.services.RedisTS.enabled "true" }}

# ===========================
# PRIMARY REDIS STATEFULSET (redis-ts-0)
# ===========================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-ts-0
  namespace: {{ .Release.Namespace }}
  labels:
    app: redis-ts
    redis-index: "0"
spec:
  serviceName: redis-ts-0
  replicas: 1
  selector:
    matchLabels:
      app: redis-ts
      redis-index: "0"
  template:
    metadata:
      labels:
        app: redis-ts
        role: master
        redis-index: "0"
    spec:
      securityContext:
        fsGroup: 65532
        runAsUser: 65532
        runAsGroup: 65532
        runAsNonRoot: true
{{- if and (eq .Values.services.RedisController.enabled "true") (eq .Values.services.RedisController.runAsSidecar "true") }}
      serviceAccountName: {{ include "redis-ts.serviceAccountName" $ }}
{{- end }}
      {{- if eq .Values.imagePullSecret.enabled "true" }}
      imagePullSecrets:
        - name: {{ .Values.imagePullSecret.value }}
      {{- end }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - redis-ts
                topologyKey: kubernetes.io/hostname
      containers:
        - name: redis
          image: {{ .Values.services.RedisTS.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: ["redis-server", "--user monitoruser on >9sIb7mh8DT6AH27irj67D  ~* +@all"]
          args:
            - --port
            - {{ .Values.services.RedisTS.internalPort | quote }}
            - --protected-mode
            - "no"
            - --dir
            - /data
            #- --user 
            #- monitoruser on >9sIb7mh8DT6AH27irj67D  ~* +@all
            #- --aclfile
            #- /data/users.acl
            # Authentication
            - --requirepass
            - "$(REDIS_PASSWORD)"
            - --masterauth
            - "$(REDIS_PASSWORD)"
            # CACHE OPTIMIZED PERSISTENCE - Minimal for Speed
            - --appendonly
            - {{ .Values.services.RedisTS.config.appendonly | quote }}
            - --save
            - {{ .Values.services.RedisTS.config.save | quote }}
            # Memory Management - TS Optimized (evict keys with TTL)
            - --maxmemory
            - {{ .Values.services.RedisTS.config.maxmemory | quote }}
            - --maxmemory-policy
            - {{ .Values.services.RedisTS.config.maxmemoryPolicy | quote }}
            - --maxmemory-samples
            - {{ .Values.services.RedisTS.config.maxmemorySamples | quote }}
            # Connection Limits
            # - --maxclients
            # - {{ .Values.services.RedisTS.config.maxclients | quote }}
            # - --tcp-backlog
            # - {{ .Values.services.RedisTS.config.tcpBacklog | quote }}
            # - --timeout
            # - {{ .Values.services.RedisTS.config.timeout | quote }}
            # - --tcp-keepalive
            # - {{ .Values.services.RedisTS.config.tcpKeepalive | quote }}
            # Performance
            - --hz
            - {{ .Values.services.RedisTS.config.hz | quote }}
            # Replication - TS Optimized (smaller backlog)
            - --repl-backlog-size
            - {{ .Values.services.RedisTS.config.replBacklogSize | quote }}
            - --repl-backlog-ttl
            - {{ .Values.services.RedisTS.config.replBacklogTtl | quote }}
            - --min-replicas-to-write
            - {{ .Values.services.RedisTS.config.minReplicasToWrite | quote }}
            - --min-replicas-max-lag
            - {{ .Values.services.RedisTS.config.minReplicasMaxLag | quote }}
            # TS-Specific Settings - Fast Eviction
            - --lazyfree-lazy-eviction
            - {{ .Values.services.RedisTS.config.lazyfreeMemoryEviction | quote }}
            - --lazyfree-lazy-server-del
            - {{ .Values.services.RedisTS.config.lazyfreeServerDel | quote }}
            - --lazyfree-lazy-expire
            - {{ .Values.services.RedisTS.config.lazyfreeLazyExpire | quote }}
            - --activedefrag
            - {{ .Values.services.RedisTS.config.activedefrag | quote }}
            - --active-expire-effort
            - {{ .Values.services.RedisTS.config.activeExpireEffort | quote }}
            - --loadmodule
            - /usr/local/lib/redis/modules/redistimeseries.so
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-ts-secret
                  key: redis-password
            - name: REDIS_PORT
              value: {{ .Values.services.RedisTS.internalPort | quote }}
          ports:
            - containerPort: {{ .Values.services.RedisTS.internalPort }}
              name: redis
          resources:
            requests:
              cpu: {{ .Values.services.RedisTS.resources.requests.cpu | quote }}
              memory: {{ .Values.services.RedisTS.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.services.RedisTS.resources.limits.cpu | quote }}
              memory: {{ .Values.services.RedisTS.resources.limits.memory | quote }}
          volumeMounts:
            - name: data
              mountPath: /data
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -p {{ .Values.services.RedisTS.internalPort }} -a "$REDIS_PASSWORD" --no-auth-warning ping | grep PONG
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -p {{ .Values.services.RedisTS.internalPort }} -a "$REDIS_PASSWORD" --no-auth-warning ping | grep PONG
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - |
                  redis-cli -p {{ .Values.services.RedisTS.internalPort }} -a "$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

{{- if and (eq .Values.services.RedisController.enabled "true") (eq .Values.services.RedisController.runAsSidecar "true") }}
        # HA Controller Sidecar
        - name: ha-controller
          image: {{ .Values.services.RedisController.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: ["python3", "/app/redis_ha_controller.py"]
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: PRIMARY_HOST
              value: "redis-ts-0-0.redis-ts-0"
            - name: SERVICE_NAME
              value: "redis-ts"
            - name: SERVICE_HOST
              value: "redis-ts-0-0.redis-ts-0.{{ $.Release.Namespace }}.svc.cluster.local"
            - name: SERVICE_PORT
              value: {{ .Values.services.RedisTS.internalPort | quote }}
            - name: REDIS_PORT
              value: {{ .Values.services.RedisTS.internalPort | quote }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-ts-secret
                  key: redis-password
            - name: REPLICA_COUNT
              value: {{ .Values.redis.replicaCount | quote }}
            - name: PROMOTABLE_REPLICAS
              value: {{ .Values.redis.promotableReplicas | quote }}
            - name: CHECK_INTERVAL_SECONDS
              value: {{ .Values.services.RedisController.checkIntervalSeconds | quote }}
            - name: FAILOVER_THRESHOLD
              value: {{ .Values.services.RedisController.failoverThreshold | quote }}
            - name: PYTHONUNBUFFERED
              value: "1"
          volumeMounts:
            - name: ha-scripts
              mountPath: /app/redis_ha_controller.py
              subPath: redis_ha_controller.py
          resources:
            requests:
              cpu: {{ .Values.services.RedisController.resources.requests.cpu | quote }}
              memory: {{ .Values.services.RedisController.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.services.RedisController.resources.limits.cpu | quote }}
              memory: {{ .Values.services.RedisController.resources.limits.memory | quote }}
{{- end }}

{{- if and (eq .Values.services.RedisController.enabled "true") (eq .Values.services.RedisController.runAsSidecar "true") }}
      volumes:
        - name: ha-scripts
          configMap:
            name: redis-ts-ha-scripts
{{- end }}

  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.storageClass.name }}
        resources:
          requests:
            storage: {{ .Values.services.RedisTS.resources.requests.storage }}

---

