{{- if eq .Values.services.RedisCache.enabled "true" }}

# ===========================
# INDIVIDUAL HEADLESS SERVICES (redis-ts-0, redis-ts-1, ...)
# ===========================

# Primary headless service
apiVersion: v1
kind: Service
metadata:
  name: redis-ts-0
  namespace: {{ .Release.Namespace }}
spec:
  clusterIP: None
  selector:
    app: redis-ts
    redis-index: "0"
  ports:
    - port: {{ .Values.services.RedisCache.port }}
      targetPort: {{ .Values.services.RedisCache.port }}
      name: redis

---

# Replica headless services
{{- range $index := until (int .Values.redis.replicaCount) }}
{{- $replicaIndex := add $index 1 }}
---
apiVersion: v1
kind: Service
metadata:
  name: redis-ts-{{ $replicaIndex }}
  namespace: {{ $.Release.Namespace }}
spec:
  clusterIP: None
  selector:
    app: redis-ts
    redis-index: {{ $replicaIndex | quote }}
  ports:
    - port: {{ $.Values.services.RedisCache.port }}
      targetPort: {{ $.Values.services.RedisCache.port }}
      name: redis
{{- end }}

---

# ===========================
# LOAD BALANCER SERVICE (routes to all pods, client discovers master)
# ===========================
apiVersion: v1
kind: Service
metadata:
  name: redis-ts
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: redis-ts
  ports:
    - port: {{ .Values.services.RedisCache.port }}
      targetPort: {{ .Values.services.RedisCache.port }}
      name: redis

{{- end }}
