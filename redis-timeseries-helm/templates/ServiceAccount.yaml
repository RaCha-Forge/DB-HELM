{{- if eq .Values.services.RedisController.enabled "true" }}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "redis-ts.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "redis-ts.labels" . | nindent 4 }}
{{- end }}
{{- end }}
