# ===========================
# Redis TS Helm Chart Values
# Optimized for: Application Caching, Session Storage, Temporary Data
# Strategy: Fast eviction, minimal persistence, speed over durability
# ===========================

# Override default names (leave empty to use chart defaults)
nameOverride: "redis-ts"
fullnameOverride: ""

# Redis configuration
redis:
  replicaCount: 1  # Number of replica pods (total pods = replicaCount + 1)
  promotableReplicas: ""  # Comma-separated replica numbers eligible for promotion (empty = all replicas)

# RBAC configuration
serviceAccount:
  create: true
  name: ""  # Auto-generated: redis-ts-failover-sa

rbac:
  create: true
  roleName: ""  # Auto-generated: redis-ts-failover-role
  roleBindingName: ""  # Auto-generated: redis-ts-failover-rb

# ConfigMap configuration
configMap:
  name: ""  # Auto-generated: redis-ts-ha-scripts

# Secret configuration
secrets:
  name: ""  # Auto-generated: redis-ts-secret
  redisPassword: "tsqwertyuiopts"

# Job configuration
job:
  name: ""  # Auto-generated: redis-ts-replication-init

# Service configuration
service:
  name: ""  # Auto-generated: redis-ts

# Lease configuration
lease:
  name: ""  # Auto-generated: redis-ts-ha-controller-lease

# Image pull secret configuration
imagePullSecret:
  enabled: "false"
  value: ecr-secret

# Image pull policy
imagePullPolicy: IfNotPresent

# Storage class configuration
storageClass:
  name: "gp3"

# Service configuration
services:
  # Replication Init Job
  ReplicationInitJob:
    enabled: "true"
    image: 599626541385.dkr.ecr.ap-south-1.amazonaws.com/fyno/redis:8.6.3

  # Redis TS Configuration - OPTIMIZED FOR CACHING
  RedisTS:
    enabled: "true"
    image: 599626541385.dkr.ecr.ap-south-1.amazonaws.com/fyno/redis:8.6.3
    port: 6005            # Client-facing Redis port
    internalPort: 6379    # Local Redis listener inside the pod
    
    # CACHE-OPTIMIZED REDIS CONFIGURATION
    config:
      # Memory Management - Evict keys with TTL first
      maxmemory: "4gb"
      maxmemoryPolicy: "noeviction"  # Only evict keys with TTL (ts pattern)
      maxmemorySamples: 10  # Better LRU accuracy
      
      # Minimal Persistence - TS can be regenerated from source
      appendonly: "yes"  # NO AOF for maximum write speed
      appendfsync: "everysec"  # Flush AOF buffer every second (minimal durability)
      save: ""  # Light RDB: only if significant changes
      
      # Fast Eviction & Memory Optimization
      activedefrag: "yes"  # Defragment memory actively
      lazyfreeMemoryEviction: "yes"  # Async eviction (non-blocking)
      lazyfreeServerDel: "yes"
      lazyfreeLazyExpire: "yes"
      
      # Network & Connection - Shorter timeouts for ts
      maxclients: 20000
      tcpBacklog: 511
      timeout: 120  # 2 minutes (shorter for ts)
      tcpKeepalive: 300
      hz: 10
      
      # Replication - Less critical for ts
      replBacklogSize: "64mb"  # Smaller backlog (ts less critical)
      replBacklogTtl: 600
      minReplicasToWrite: 0
      minReplicasMaxLag: 10
      
      # Performance
      activeExpireEffort: 3  # More aggressive TTL expiration
    
    resources:
      requests:
        storage: "30Gi"  # Smaller - ts is ephemeral
        cpu: "1"
        memory: "4Gi"
      limits:
        cpu: "1"
        memory: "5Gi"

  # Envoy proxy for seamless master routing.
  # Applications should connect to service.name (redis-ts by default);
  # Envoy routes traffic to the current Redis master service.
  Envoy:
    enabled: "true"
    image: envoyproxy/envoy:v1.30.0
    mode: DaemonSet         # deployment or daemonset
    replicas: 2              # Used only when mode=deployment
    serviceName: ""          # Auto-generated: redis-ts
    masterServiceName: ""    # Auto-generated: redis-ts-master
    servicePort: 6005        # Client-facing port exposed by Envoy
    adminPort: 9901          # Envoy admin interface port
    connectTimeout: 5s       # Upstream connection timeout
    maxConnectAttempts: 60
    idleTimeout: 240s        # Keep TCP sessions open during short failover windows
    maxDownstreamConnectionDuration: 0s
    drainTimeout: 180s       # Envoy drain timeout during rollout/shutdown
    terminationGracePeriodSeconds: 150
    concurrency: 2
    logLevel: info
    dnsRefreshRate: 2s
    tcpKeepalive:
      keepaliveTime: 60
      keepaliveInterval: 10
      keepaliveProbes: 6
    resources:
      requests:
        cpu: "100m"
        memory: "100Mi"
      limits:
        cpu: "200m"
        memory: "200Mi"

  # Redis Controller (HA Failover)
  RedisController:
    enabled: "true"
    runAsSidecar: "false"
    image: 599626541385.dkr.ecr.ap-south-1.amazonaws.com/fyno/mongo:ha-python
    replicas: 2
    checkIntervalSeconds: 1       # How often the controller checks master health
    failoverThreshold: 3          # Number of consecutive failures before failover
    resources:
      requests:
        cpu: "100m"
        memory: "200Mi"
      limits:
        cpu: "100m"
        memory: "200Mi"
