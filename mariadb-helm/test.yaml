apiVersion: v1
kind: Service
metadata:
  annotations:
    meta.helm.sh/release-name: mongodb
    meta.helm.sh/release-namespace: mongo
    service.beta.kubernetes.io/aws-load-balancer-internal: "true"
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    service.beta.kubernetes.io/aws-load-balancer-scheme: Internal
    service.beta.kubernetes.io/aws-load-balancer-subnets: subnet-0ac0aed33c21cf76e,subnet-0d9cc45a6500dbac2
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
  labels:
    app: mongo-arbiter
    app.kubernetes.io/managed-by: Helm
  name: mongo-arbiter
  namespace: mongo
spec:
  ports:
  - name: mongodb
    port: 27017
    protocol: TCP
    targetPort: 27017
  selector:
    app: mongo-arbiter
  sessionAffinity: None
  type: LoadBalancer
