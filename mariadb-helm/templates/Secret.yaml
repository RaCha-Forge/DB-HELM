apiVersion: v1
kind: Secret
metadata:
  name: mariadb-secret
  namespace: {{ .Values.Namespace.name }}
  labels:
    app: mariadb
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
type: Opaque
data:
  root-password: {{ required "root-password is required!" .Values.secrets.rootPassword | b64enc }}
  app-user: {{ required "app-user is required!" .Values.secrets.appUser | b64enc }}
  app-password: {{ required "app-password is required!" .Values.secrets.appPassword | b64enc }}

 
 