{{- if eq .Values.services.Maria.enabled "true" }}
{{- if eq .Values.services.MariaController.enabled "true" }}

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mariadb-ha-role
  namespace: {{ .Values.Namespace.name }}
rules:
- apiGroups:
  - ""
  resources:
  - services
  verbs:
  - get
  - list
  - watch
  - patch
  - update
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - endpoints
  verbs:
  - get
  - list
  - watch
  - patch
  - update
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - create
  - patch
  - update
  - delete
{{- end }}
{{- end }}