{{- if and (eq .Values.services.RedisController.enabled "true") (eq .Values.services.RedisController.runAsSidecar "false") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-db-ha-controller
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.services.RedisController.replicas }}
  selector:
    matchLabels:
      app: redis-db-ha-controller
  template:
    metadata:
      labels:
        app: redis-db-ha-controller
    spec:
      serviceAccountName: {{ include "redis-db.serviceAccountName" . }}
      {{- if eq .Values.imagePullSecret.enabled "true" }}
      imagePullSecrets:
        - name: {{ .Values.imagePullSecret.value }}
      {{- end }}

      # --------------------------
      # MAIN CONTROLLER
      # --------------------------
      containers:
        - name: ha-controller
          image: {{ .Values.services.RedisController.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: ["python3", "/app/redis_ha_controller.py"]
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: PRIMARY_HOST
              value: "redis-db-0-0.redis-db-0"
            - name: SERVICE_NAME
              value: "redis-db"
            - name: SERVICE_HOST
              value: "redis-db-0-0.redis-db-0.{{ .Release.Namespace }}.svc.cluster.local"
            - name: SERVICE_PORT
              value: {{ .Values.services.RedisCache.internalPort | quote }}
            - name: REDIS_PORT
              value: {{ .Values.services.RedisCache.internalPort | quote }}
            - name: CHECK_INTERVAL_SECONDS
              value: {{ .Values.services.RedisController.checkIntervalSeconds | quote }}
            - name: FAILOVER_THRESHOLD
              value: {{ .Values.services.RedisController.failoverThreshold | quote }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-db-secret
                  key: redis-password
            - name: REPLICA_COUNT
              value: {{ .Values.redis.replicaCount | quote }}
            - name: PROMOTABLE_REPLICAS
              value: {{ .Values.redis.promotableReplicas | quote }}
            - name: LEADER_ELECTION_ENABLED
              value: "true"
            - name: LEASE_NAME
              value: "redis-ha-controller-lease"
            - name: PYTHONPATH
              value: "/deps"
            - name: PYTHONUNBUFFERED
              value: "1"
          volumeMounts:
            - name: script
              mountPath: /app/redis_ha_controller.py
              subPath: redis_ha_controller.py
            - name: deps
              mountPath: /deps
          resources:
            requests:
              cpu: {{ .Values.services.RedisController.resources.requests.cpu | quote }}
              memory: {{ .Values.services.RedisController.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.services.RedisController.resources.limits.cpu | quote }}
              memory: {{ .Values.services.RedisController.resources.limits.memory | quote }}

      # --------------------------
      # VOLUMES
      # --------------------------
      volumes:
        - name: script
          configMap:
            name: {{ include "redis-db.configMapName" . }}
        - name: deps
          emptyDir: {}

{{- end }}
