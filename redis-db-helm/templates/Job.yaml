{{- if and (eq .Values.services.RedisDB.enabled "true") (eq .Values.services.ReplicationInitJob.enabled "true") }}
apiVersion: batch/v1
kind: Job
metadata:
  name: redis-db-replication-init
  namespace: {{ .Release.Namespace }}
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: init
          image: {{ .Values.services.ReplicationInitJob.image | default "redis/redis-stack-server:latest" }}
          command: ["/bin/sh", "-c"]
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-db-secret
                  key: redis-password
            - name: REPLICA_COUNT
              value: {{ .Values.redis.replicaCount | quote }}
            - name: REDIS_PORT
              value: {{ .Values.services.RedisDB.port | quote }}
          args:
            - |
              set -euo pipefail

              PRIMARY_HOST="redis-db-0-0.redis-db-0.{{ .Release.Namespace }}.svc.cluster.local"
              SERVICE_HOST="redis-db.{{ .Release.Namespace }}.svc.cluster.local"
              REPLICA_COUNT="{{ .Values.redis.replicaCount }}"
              PORT="{{ .Values.services.RedisDB.port }}"

              echo "Waiting for Redis primary (redis-db-0-0) to be ready..."
              for i in $(seq 1 90); do
                if redis-cli -h "$PRIMARY_HOST" -p "$PORT" -a "$REDIS_PASSWORD" --no-auth-warning ping >/dev/null 2>&1; then
                  echo "Primary is ready"; break; fi
                sleep 2
                if [ "$i" -eq 90 ]; then echo "Primary not ready after wait"; exit 1; fi
              done

              echo "Waiting for all Redis replicas to be ready..."
              for i in $(seq 1 $REPLICA_COUNT); do
                REPLICA_HOST="redis-db-${i}-0.redis-db-${i}.{{ .Release.Namespace }}.svc.cluster.local"
                echo "Waiting for replica redis-db-${i}-0 at $REPLICA_HOST..."
                
                for attempt in $(seq 1 90); do
                  if nslookup "$REPLICA_HOST" >/dev/null 2>&1; then
                    echo "  DNS resolved for redis-db-${i}-0"
                    break
                  fi
                  sleep 2
                  if [ "$attempt" -eq 90 ]; then
                    echo "  ERROR: DNS failed for redis-db-${i}-0 after 3 minutes"
                    exit 1
                  fi
                done

                for attempt in $(seq 1 90); do
                  if redis-cli -h "$REPLICA_HOST" -p "$PORT" -a "$REDIS_PASSWORD" --no-auth-warning ping >/dev/null 2>&1; then
                    echo "  ✓ redis-db-${i}-0 is ready"
                    break
                  fi
                  sleep 2
                  if [ "$attempt" -eq 90 ]; then
                    echo "  ERROR: redis-db-${i}-0 not ready after 3 minutes"
                    exit 1
                  fi
                done
              done

              echo "Configuring replication on all replicas..."
              for i in $(seq 1 $REPLICA_COUNT); do
                REPLICA_HOST="redis-db-${i}-0.redis-db-${i}.{{ .Release.Namespace }}.svc.cluster.local"
                echo "Configuring replica redis-db-${i}-0: $REPLICA_HOST"
                
                echo "Setting up replication on redis-db-${i}-0 to follow service endpoint..."
                redis-cli -h "$REPLICA_HOST" -p "$PORT" -a "$REDIS_PASSWORD" --no-auth-warning \
                  REPLICAOF "$SERVICE_HOST" "$PORT" || {
                  echo "ERROR: Failed to configure replication on redis-db-${i}-0"; exit 1; }
                echo "✔ redis-db-${i}-0 configured to replicate from $SERVICE_HOST"
              done

              echo "✅ All Redis replicas configured successfully"
{{- end }}
