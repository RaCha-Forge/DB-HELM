# ===========================
# Redis DB Helm Chart Values
# Optimized for: Critical Data Storage, Persistent Database
# Strategy: Maximum durability, no eviction, aggressive persistence
# ===========================

# Override default names (leave empty to use chart defaults)
nameOverride: "redis-db"
fullnameOverride: ""

# Redis configuration
redis:
  replicaCount: 1  # Number of replica pods (total pods = replicaCount + 1)
  promotableReplicas: ""  # Comma-separated replica numbers eligible for promotion (empty = all replicas)

# RBAC configuration
serviceAccount:
  create: true
  name: ""  # Auto-generated: redis-db-failover-sa

rbac:
  create: true
  roleName: ""  # Auto-generated: redis-db-failover-role
  roleBindingName: ""  # Auto-generated: redis-db-failover-rb

# ConfigMap configuration
configMap:
  name: ""  # Auto-generated: redis-db-ha-scripts

# Secret configuration
secrets:
  name: ""  # Auto-generated: redis-db-secret
  redisPassword: "qazwsxedcrfv"

# Job configuration
job:
  name: ""  # Auto-generated: redis-db-replication-init

# Service configuration
service:
  name: ""  # Auto-generated: redis-db

# Lease configuration
lease:
  name: ""  # Auto-generated: redis-db-ha-controller-lease

# Image pull secret configuration
imagePullSecret:
  enabled: "true"
  value: ecr-secret

# Image pull policy
imagePullPolicy: IfNotPresent

# Storage class configuration
storageClass:
  name: "gp3"

# Service configuration
services:
  # Replication Init Job
  ReplicationInitJob:
    enabled: "true"
    image: 599626541385.dkr.ecr.ap-south-1.amazonaws.com/fyno/redis:8.6.3

  # Redis DB Configuration - OPTIMIZED FOR CRITICAL DATABASE
  RedisDB:
    enabled: "true"
    image: 599626541385.dkr.ecr.ap-south-1.amazonaws.com/fyno/redis:8.6.3
    port: 6001            # Client-facing Redis port
    internalPort: 6379    # Local Redis listener inside the pod
    
    # DATABASE-OPTIMIZED REDIS CONFIGURATION
    config:
      # Memory Management - NEVER evict data
      maxmemory: "2gb"
      maxmemoryPolicy: "noeviction"  # Return error when full (protect data integrity)
      
      # Aggressive Persistence - ZERO data loss
      appendonly: "yes"
      appendfilename: "appendonly.aof"
      appendfsync: "everysec"  # Fsync EVERY write (safest, slower)
      noAppendfsyncOnRewrite: "no"
      autoAofRewritePercentage: 100
      autoAofRewriteMinSize: "64mb"
      aofUseRdbPreamble: "yes"  # Hybrid persistence
      
      # Aggressive RDB Snapshots
      save: ""  # Very frequent snapshots
      stopWritesOnBgsaveError: "yes"  # Stop writes if snapshot fails
      rdbcompression: "yes"
      rdbchecksum: "yes"
      
      # Slow but Safe Settings
      lazyfreeMemoryEviction: "no"  # Synchronous (slower but safer)
      activedefrag: "no"  # Prevent latency spikes
      
      # Network & Connection - Longer timeouts for DB
      maxclients: 20000  # Lower (DB operations slower)
      tcpBacklog: 511
      timeout: 600  # 10 minutes (long DB queries)
      tcpKeepalive: 300
      hz: 10
      
      # Replication - Critical for DB
      replBacklogSize: "512mb"  # Large backlog (critical data)
      replBacklogTtl: 3600  # 1 hour
      minReplicasToWrite: 0  # Standalone: allow writes without replicas
      minReplicasMaxLag: 5  # Tight lag requirement (5s)
      replDisklessSync: "no"  # Use disk (safer)
      
      # Memory & Expiration
      activeExpireEffort: 1  # Minimal expiration (preserve data)
    
    resources:
      requests:
        storage: "15Gi"  # Large persistent storage
        cpu: "1"
        memory: "1Gi"
      limits:
        cpu: "1"
        memory: "2Gi"

  # Envoy proxy for seamless master routing.
  # Applications should connect to service.name (redis-cache by default);
  # Envoy routes traffic to the current Redis master service.
  Envoy:
    enabled: "true"
    image: envoyproxy/envoy:v1.30.0
    mode: DaemonSet         # deployment or daemonset
    replicas: 2              # Used only when mode=deployment
    serviceName: ""          # Auto-generated: redis-cache
    masterServiceName: ""    # Auto-generated: redis-cache-master
    servicePort: 6001        # Client-facing port exposed by Envoy
    adminPort: 9901          # Envoy admin interface port
    connectTimeout: 5s       # Upstream connection timeout
    maxConnectAttempts: 1000000
    idleTimeout: 0s        # Keep TCP sessions open during short failover windows
    maxDownstreamConnectionDuration: 0s
    drainTimeout: 180s       # Envoy drain timeout during rollout/shutdown
    terminationGracePeriodSeconds: 150
    concurrency: 2
    logLevel: info
    dnsRefreshRate: 2s
    tcpKeepalive:
      keepaliveTime: 60
      keepaliveInterval: 10
      keepaliveProbes: 6
    resources:
      requests:
        cpu: "100m"
        memory: "100Mi"
      limits:
        cpu: "200m"
        memory: "200Mi"

  # Redis Controller (HA Failover)
  RedisController:
    enabled: "true"
    runAsSidecar: "false"
    image: 599626541385.dkr.ecr.ap-south-1.amazonaws.com/fyno/mongo:ha-python
    replicas: 2
    checkIntervalSeconds: 1       # How often the controller checks master health
    failoverThreshold: 3          # Number of consecutive failures before failover
    resources:
      requests:
        cpu: "100m"
        memory: "200Mi"
      limits:
        cpu: "100m"
        memory: "200Mi"
