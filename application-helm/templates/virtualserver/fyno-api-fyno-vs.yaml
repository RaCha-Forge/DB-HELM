{{- if eq .Values.f5.vs_enabled "true" }}

apiVersion: cis.f5.com/v1
kind: VirtualServer
metadata:
  name: {{ .Release.Name }}-api-vs
  namespace: {{ .Release.Namespace }}
  labels:
    f5cr: "true"
spec:
  host: {{ .Values.vsdomains.api }}
  hostGroup: fyno-apps
  virtualServerAddress: {{ .Values.f5.virtualServerAddress }}
  tlsProfileName: k8s-esafbankorg-tls
  bigipRouteDomain: 70
  pools:
    - path: /
      service: {{ .Release.Name }}-api-service-svc
      servicePort: 443
      monitor:
        type: tcp
{{- end }}
