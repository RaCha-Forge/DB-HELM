{{- if and (eq .Values.f5.vs_enabled "true") (eq (.Values.services.connect_frontend.enabled | toString | lower) "true") }}
apiVersion: cis.f5.com/v1
kind: VirtualServer
metadata:
  name: {{ .Release.Name }}-connect-vs
  namespace: {{ .Release.Namespace }}
  labels:
    f5cr: "true"
spec:
  host: {{ .Values.vsdomains.connect }}
  hostGroup: fyno-apps
  virtualServerAddress: {{ .Values.f5.virtualServerAddress }}
  tlsProfileName: k8s-esafbankorg-tls
  bigipRouteDomain: 70
  pools:
  - path: /
    service: {{ .Release.Name }}-connect-frontend-svc
    servicePort: {{ (index .Values.services.connect_frontend.svcPorts 0).port | default 80 }}
    monitor:
      type: tcp
{{- end }}