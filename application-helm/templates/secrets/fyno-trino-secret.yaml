{{- if or (eq (.Values.services.trino.enabled | toString | lower) "true") (eq (.Values.services.trino_worker.enabled | toString | lower) "true") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-trino-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  MINIO_USER: {{ .Values.db.MINIO_USER | toString | b64enc }}
  MINIO_PASSWORD: {{ .Values.db.MINIO_PASSWORD | toString | b64enc }}
{{- end }}