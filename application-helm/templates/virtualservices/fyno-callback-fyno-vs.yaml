{{- if eq .Values.istio.vs_enabled "true" }}

apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: {{ .Release.Name }}-callback-vs
  namespace: {{ .Release.Namespace }}
spec:
  gateways:
  - {{ .Release.Namespace }}/fyno-gateway
  hosts:
  - {{ .Values.vsdomains.callback }}
  http:
  - match:
    - uri:
        prefix: /
    route:
    - destination:
        host: {{ .Release.Name }}-dlr-svc
        port:
          number: 80

{{- end }}
