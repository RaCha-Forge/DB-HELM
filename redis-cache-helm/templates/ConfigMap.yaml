{{- if or (eq (toString .Values.services.RedisController.enabled) "true") (eq (toString .Values.services.Envoy.enabled) "true") }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-cache-ha-scripts
  namespace: {{ $.Release.Namespace }}
data:
{{- if eq (toString .Values.services.RedisController.enabled) "true" }}
  redis_ha_controller.py: {{ .Files.Get "files/redis_ha_controller.py" | quote }}
{{- end }}
{{- if eq (toString .Values.services.Envoy.enabled) "true" }}
  envoy.yaml: |-
    static_resources:
      listeners:
        - name: redis_listener
          address:
            socket_address:
              address: 0.0.0.0
              port_value: {{ $.Values.services.Envoy.servicePort }}
          filter_chains:
            - filters:
                - name: envoy.filters.network.tcp_proxy
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
                    stat_prefix: redis
                    cluster: redis_upstream
                    idle_timeout: {{ $.Values.services.Envoy.idleTimeout }}
{{- if not (or (eq (toString $.Values.services.Envoy.maxDownstreamConnectionDuration) "0s") (eq (toString $.Values.services.Envoy.maxDownstreamConnectionDuration) "0")) }}
                    max_downstream_connection_duration: {{ $.Values.services.Envoy.maxDownstreamConnectionDuration }}
{{- end }}
                    max_connect_attempts: {{ $.Values.services.Envoy.maxConnectAttempts }}
                    # max_early_data_bytes: {{ $.Values.services.Envoy.maxEarlyDataBytes }}
      clusters:
        - name: redis_upstream
          connect_timeout: {{ $.Values.services.Envoy.connectTimeout }}
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          dns_refresh_rate: {{ $.Values.services.Envoy.dnsRefreshRate }}
          upstream_connection_options:
            tcp_keepalive:
              keepalive_time: {{ $.Values.services.Envoy.tcpKeepalive.keepaliveTime }}
              keepalive_interval: {{ $.Values.services.Envoy.tcpKeepalive.keepaliveInterval }}
              keepalive_probes: {{ $.Values.services.Envoy.tcpKeepalive.keepaliveProbes }}
          load_assignment:
            cluster_name: redis_upstream
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: {{ include "redis-cache.masterServiceName" $ }}.{{ $.Release.Namespace }}.svc.cluster.local
                          port_value: {{ .Values.services.RedisCache.internalPort }}
    admin:
      access_log_path: /tmp/admin_access.log
      address:
        socket_address:
          address: 0.0.0.0
          port_value: {{ $.Values.services.Envoy.adminPort }}
{{- end }}
{{- end }}
