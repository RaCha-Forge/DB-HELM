{{- if eq .Values.services.RedisCache.enabled "true" }}

# ===========================
# INDIVIDUAL HEADLESS SERVICES (redis-cache-0, redis-cache-1, ...)
# ===========================

# Primary headless service
apiVersion: v1
kind: Service
metadata:
  name: redis-cache-0
  namespace: {{ .Release.Namespace }}
spec:
  clusterIP: None
  selector:
    app: redis-cache
    redis-index: "0"
  ports:
    - port: {{ .Values.services.RedisCache.internalPort }}
      targetPort: {{ .Values.services.RedisCache.internalPort }}
      name: redis

---

# Replica headless services
{{- range $index := until (int .Values.redis.replicaCount) }}
{{- $replicaIndex := add $index 1 }}
---
apiVersion: v1
kind: Service
metadata:
  name: redis-cache-{{ $replicaIndex }}
  namespace: {{ $.Release.Namespace }}
spec:
  clusterIP: None
  selector:
    app: redis-cache
    redis-index: {{ $replicaIndex | quote }}
  ports:
    - port: {{ $.Values.services.RedisCache.internalPort }}
      targetPort: {{ $.Values.services.RedisCache.internalPort }}
      name: redis
{{- end }}

---

{{- if eq (toString .Values.services.Envoy.enabled) "true" }}
# ===========================
# APP-FACING ENVOY SERVICE
# ===========================
apiVersion: v1
kind: Service
metadata:
  name: {{ include "redis-cache.envoyServiceName" . }}
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: redis-cache-envoy
  ports:
    - port: {{ .Values.services.RedisCache.port }}
      targetPort: redis-proxy
      name: redis

---

# ===========================
# REDIS MASTER SERVICE (Envoy and replicas route here)
# ===========================
apiVersion: v1
kind: Service
metadata:
  name: {{ include "redis-cache.masterServiceName" . }}
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: redis-cache
    role: master
  ports:
    - port: {{ .Values.services.RedisCache.internalPort }}
      targetPort: {{ .Values.services.RedisCache.internalPort }}
      name: redis
{{- else }}
# ===========================
# APP-FACING REDIS MASTER SERVICE
# ===========================
apiVersion: v1
kind: Service
metadata:
  name: {{ include "redis-cache.serviceName" . }}
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: redis-cache
    role: master
  ports:
    - port: {{ .Values.services.RedisCache.port }}
      targetPort: {{ .Values.services.RedisCache.internalPort }}
      name: redis
{{- end }}

{{- end }}
