{{- if eq .Values.services.RedisController.enabled "true" }}
{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "redis-cache.roleBindingName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "redis-cache.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "redis-cache.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  apiGroup: rbac.authorization.k8s.io
  name: {{ include "redis-cache.roleName" . }}
{{- end }}
{{- end }}
