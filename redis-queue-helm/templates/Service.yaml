{{- if eq .Values.services.RedisQueue.enabled "true" }}

# ===========================
# INDIVIDUAL HEADLESS SERVICES (redis-queue-0, redis-queue-1, ...)
# ===========================

# Primary headless service
apiVersion: v1
kind: Service
metadata:
  name: redis-queue-0
  namespace: {{ .Release.Namespace }}
spec:
  clusterIP: None
  selector:
    app: redis-queue
    redis-index: "0"
  ports:
    - port: {{ .Values.services.RedisQueue.internalPort }}
      targetPort: {{ .Values.services.RedisQueue.internalPort }}
      name: redis

---

# Replica headless services
{{- range $index := until (int .Values.redis.replicaCount) }}
{{- $replicaIndex := add $index 1 }}
---
apiVersion: v1
kind: Service
metadata:
  name: redis-queue-{{ $replicaIndex }}
  namespace: {{ $.Release.Namespace }}
spec:
  clusterIP: None
  selector:
    app: redis-queue
    redis-index: {{ $replicaIndex | quote }}
  ports:
    - port: {{ $.Values.services.RedisQueue.internalPort }}
      targetPort: {{ $.Values.services.RedisQueue.internalPort }}
      name: redis
{{- end }}

---

{{- if eq (toString .Values.services.Envoy.enabled) "true" }}
# ===========================
# APP-FACING ENVOY SERVICE
# ===========================
apiVersion: v1
kind: Service
metadata:
  name: {{ include "redis-queue.envoyServiceName" . }}
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: redis-queue-envoy
  ports:
    - port: {{ .Values.services.RedisQueue.port }}
      targetPort: redis-proxy
      name: redis

---

# ===========================
# REDIS MASTER SERVICE (Envoy and replicas route here)
# ===========================
apiVersion: v1
kind: Service
metadata:
  name: {{ include "redis-queue.masterServiceName" . }}
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: redis-queue
    role: master
  ports:
    - port: {{ .Values.services.RedisQueue.internalPort }}
      targetPort: {{ .Values.services.RedisQueue.internalPort }}
      name: redis
{{- else }}
# ===========================
# APP-FACING REDIS MASTER SERVICE
# ===========================
apiVersion: v1
kind: Service
metadata:
  name: {{ include "redis-queue.serviceName" . }}
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: redis-queue
    role: master
  ports:
    - port: {{ .Values.services.RedisQueue.port }}
      targetPort: {{ .Values.services.RedisQueue.internalPort }}
      name: redis
{{- end }}

{{- end }}
