    matchLabels:
      app: mongo-arbiter
      arbiter-index: {{ $index | quote }}
  template:
    metadata:
      labels:
        app: mongo-arbiter
        arbiter-index: {{ $index | quote }}
    spec:
      # securityContext:
      #   fsGroup: 65532
      #   runAsUser: 65532
      #   runAsGroup: 65532
      #   runAsNonRoot: true
      terminationGracePeriodSeconds: {{ $.Values.arbiter.terminationGracePeriodSeconds }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: mongo
              topologyKey: kubernetes.io/hostname
      containers:
        - name: mongo-arbiter
          image: {{ $.Values.image.registry }}/{{ $.Values.image.repository }}:{{ $.Values.image.tag }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          # command: ["mongod"]
          args:
            - "--replSet={{ $.Values.replicaSet.name }}"
            - "--bind_ip_all"
            - "--port={{ $.Values.replicaSet.port }}"
          ports:
            - containerPort: {{ $.Values.replicaSet.port }}
              name: mongodb
          resources:
            limits:
              cpu: {{ $.Values.arbiter.resources.limits.cpu | quote }}
              memory: {{ $.Values.arbiter.resources.limits.memory }}
            requests:
              cpu: {{ $.Values.arbiter.resources.requests.cpu | quote }}
              memory: {{ $.Values.arbiter.resources.requests.memory }}
          volumeMounts:
            - name: {{ $.Values.arbiter.volumeName }}
              mountPath: /data/db
      {{- if $.Values.image.pullSecret.enabled }}
      imagePullSecrets:
      - name: {{ $.Values.image.pullSecret.name }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: {{ $.Values.arbiter.volumeName }}
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ $.Values.storageClass.name }}
        resources:
          requests:
            storage: {{ $.Values.arbiter.resources.requests.storage }}
{{- end }}
{{- end }}
